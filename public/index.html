<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="从维基百科提取并展示 Z-Library 官方链接" />
    <title>Z-Library 官方链接</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>

    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Wikipedia → Official Link</p>
        <h1>Z-Library 官方链接</h1>
        <p class="subtitle">
          从维基百科信息框自动提取最新可用网址，点击即可跳转。
        </p>
      </header>

      <section class="card" id="status-card" aria-live="polite">
        <div class="status-row">
          <span class="dot" id="status-dot" data-state="loading"></span>
          <span id="status-text">正在从维基百科获取链接…</span>
        </div>
        <p class="meta" id="fetched-at" hidden></p>
      </section>

      <section class="card primary-card" id="primary-card" hidden>
        <h2>推荐入口</h2>
        <a
          id="primary-link"
          class="primary-btn"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="btn-label">打开官方网站</span>
          <span class="btn-url" id="primary-url-text"></span>
        </a>
        <button type="button" class="ghost-btn" id="copy-primary" hidden>
          复制链接
        </button>
      </section>

      <section class="card" id="links-card" hidden>
        <div class="section-head">
          <h2>全部候选链接</h2>
          <button type="button" class="ghost-btn compact" id="refresh-btn">
            刷新
          </button>
        </div>
        <ul class="link-list" id="link-list"></ul>
      </section>

      <section class="card muted" id="sources-card" hidden>
        <h2>数据来源</h2>
        <ul class="source-list" id="source-list"></ul>
      </section>

      <footer class="footer">
        <p>
          数据来自
          <a href="https://zh.wikipedia.org/wiki/Z-Library" target="_blank" rel="noopener noreferrer"
            >中文维基百科</a
          >
          /
          <a href="https://en.wikipedia.org/wiki/Z-Library" target="_blank" rel="noopener noreferrer"
            >English Wikipedia</a
          >
          ，仅作信息展示。
        </p>
        <p class="api-hint">
          API：<code>/api/link</code>
        </p>
      </footer>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
